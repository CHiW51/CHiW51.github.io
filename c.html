<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คัดลอกข้อความ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 90%;
    max-width: 420px;
    padding: 30px;
    background: #ffffff;
    color: #222;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 35px #0005;
}

h2 {
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 140px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    resize: none;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#status {
    margin-top: 12px;
    color: #16a34a;
}
</style>
</head>

<body>

<div class="container">
    <h2>📋 คัดลอกข้อความ</h2>
    <p>กดปุ่มด้านล่างเพื่อคัดลอก</p>

    <textarea id="myText">8.20464° N, 100.02629° E</textarea>

    <button onclick="copyText()">
        📋 คัดลอกข้อความ
    </button>

    <p id="status"></p>
</div>

<script>
function copyText() {
    const text = document.getElementById("myText");

    navigator.clipboard.writeText(text.value)
    .then(() => {
        document.getElementById("status").innerText =
            "คัดลอกข้อความเรียบร้อยแล้ว!";
    })
    .catch(() => {
        text.select();
        document.execCommand("copy");
        document.getElementById("status").innerText =
            "คัดลอกข้อความแล้ว!";
    });
}
</script>

</body>
</html>
