<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHIWSPACE — 3D Immersive Experience</title>
  <meta name="description" content="CHIWSPACE — Interactive 3D Digital Universe Art Installation">
  <meta name="theme-color" content="#020206">
  
  <link rel="stylesheet" href="style.css">

  <!-- Three.js (r128) via CDN with resilient multi-CDN fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <!-- WebGL 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Cinematic Vignette & Atmospheric Depth Layer -->
  <div class="cinematic-overlay" aria-hidden="true"></div>

  <!-- Opening Curtain for cinematic fade from darkness -->
  <div class="opening-curtain" id="openingCurtain" aria-hidden="true"></div>

  <!-- Accessible semantic identifier (Zero visible UI/text except 3D CHIWWIE) -->
  <h1 class="sr-only">CHIWWIE</h1>

  <!-- Futuristic Custom Trailing Cursor -->
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
